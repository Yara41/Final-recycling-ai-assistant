# Supabase CLI config for this repo's Edge Functions.
#
# Target project (the only one this repo may deploy to):
#   EcoWasteAI  ref = uwxksbwlzjrjlccbdjtk  region = ap-south-1
#   https://uwxksbwlzjrjlccbdjtk.supabase.co
# Database changes live in supabase/migrations (see docs/AGENT_SETUP.md).
#
# Deploy with the pinned npm script (passes --project-ref explicitly):
#   npm run supabase:deploy
project_id = "uwxksbwlzjrjlccbdjtk"

# Keep JWT verification ON: the gateway rejects requests without a valid project JWT.
[functions.chat]
verify_jwt = true

[functions.classify]
verify_jwt = true

[functions.agent]
verify_jwt = true

# Called by pg_cron with the x-cron-secret header (checked in the function).
[functions.insights]
verify_jwt = false
